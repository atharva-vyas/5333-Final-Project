networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

services:
  dns:
    build:
      context: ./dns
      dockerfile: Dockerfile
    container_name: dns_server
    restart: unless-stopped
    ports:
      - "53:53/udp"
    volumes:
      - ./dns/dnsmasq.conf:/etc/dnsmasq.conf:ro
    networks:
      app-network:
        ipv4_address: 172.20.0.20
    cap_add:
      - NET_ADMIN

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets/authelia.conf:/etc/nginx/snippets/authelia.conf:ro
      - ./nginx/snippets/auth.conf:/etc/nginx/snippets/auth.conf:ro
      - ./nginx/ssl/example.com-key.pem:/etc/nginx/ssl/example.com-key.pem:ro
      - ./nginx/ssl/example.com.crt:/etc/nginx/ssl/example.com.crt:ro
      - ./nginx/ssl/example.com.key:/etc/nginx/ssl/example.com.key:ro
      - ./nginx/ssl/example.com.pem:/etc/nginx/ssl/example.com.pem:ro
    depends_on:
      - authelia
    networks:
      app-network:
        ipv4_address: 172.20.0.30
    dns:
      - 172.20.0.20

  authelia:
    image: authelia/authelia
    container_name: authelia
    volumes:
      - ./authelia:/config
    ports:
      - 9091
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Vancouver
    networks:
      app-network:
        ipv4_address: 172.20.0.40
    dns:
      - 172.20.0.20

  redis:
    image: redis:alpine
    container_name: redis_authelia
    volumes:
      - ./redis:/data
    expose:
      - 6379
    restart: unless-stopped
    environment:
      - TZ=America/Vancouver
      - PUID=1000
      - PGID=1000
    networks:
      app-network:
        ipv4_address: 172.20.0.50
    dns:
      - 172.20.0.20

  flask:
    image: alpine
    container_name: flask
    volumes:
      - ./flask/app.py:/app/app.py:ro
    working_dir: /app
    command: sh -c "apk update && apk add --no-cache py3-flask && flask run --host=0.0.0.0 --port=80"
    environment:
      - FLASK_APP=app.py
    networks:
      app-network:
        ipv4_address: 172.20.0.60
    dns:
      - 172.20.0.20

