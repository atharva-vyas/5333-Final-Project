services:
  nginx-public:
    image: nginx:latest
    container_name: nginx-public
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    networks:
      infrastructure-network:
        ipv4_address: 172.20.0.2
    volumes:
      - ./nginx-public/etc/atharvavyas.com.pem:/etc/ssl/atharvavyas.com.pem
      - ./nginx-public/etc/atharvavyas.com.key:/etc/ssl/atharvavyas.com.key
      - ./nginx-public/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx-public/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf

  never-idle:
    build:
      context: .
      dockerfile: neverIdle/Dockerfile
    container_name: neverIdle
    privileged: true
    restart: unless-stopped
    networks:
      infrastructure-network:
        ipv4_address: 172.20.0.3
    volumes:
      - ./neverIdle/home/NeverIdle:/home/NeverIdle
      - ./neverIdle/home/README.md:/home/README.md
      - ./neverIdle/home/main.py:/home/main.py
      - ./neverIdle/home/script.sh:/home/script.sh
      - ./nginx-public/nginx/nginx.conf:/etc/nginx/nginx.conf

  wireguard:
    build:
      context: .
      dockerfile: wireguard/Dockerfile
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - "51820:51820/udp"
      - "51821:51821/udp"
      - "51822:51822/udp"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - PEERS=1
      - LOG_CONFS=true
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
    networks:
      infrastructure-network:
        ipv4_address: 172.20.0.4

  wg-portal:
    image: wgportal/wg-portal:v2
    container_name: wg-portal
    cap_add:
      - NET_ADMIN
    network_mode: "service:wireguard" # So we ensure to stay on the same network as the wireguard container.
    restart: unless-stopped
    depends_on:
      - wireguard
    volumes:
      - ./wg-portal/app/data:/app/data
      - ./wg-portal/app/config:/app/config

  dns:
    build:
      context: ./dns
      dockerfile: Dockerfile
    container_name: dns_server
    restart: unless-stopped
    network_mode: "service:wireguard" # So we ensure to stay on the same network as the wireguard container.
    depends_on:
      - wireguard
    volumes:
      - ./dns/dnsmasq.conf:/etc/dnsmasq.conf:ro

  nginx_authelia:
    image: nginx:alpine
    container_name: nginx_authelia
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets/authelia.conf:/etc/nginx/snippets/authelia.conf:ro
      - ./nginx/snippets/auth.conf:/etc/nginx/snippets/auth.conf:ro
      - ./nginx/ssl/atharvavyas.com-key.pem:/etc/nginx/ssl/atharvavyas.com-key.pem:ro
      - ./nginx/ssl/atharvavyas.com.crt:/etc/nginx/ssl/atharvavyas.com.crt:ro
      - ./nginx/ssl/atharvavyas.com.key:/etc/nginx/ssl/atharvavyas.com.key:ro
      - ./nginx/ssl/atharvavyas.com.pem:/etc/nginx/ssl/atharvavyas.com.pem:ro
    network_mode: "service:wireguard" # So we ensure to stay on the same network as the wireguard container.
    depends_on:
      - wireguard

  authelia:
    image: authelia/authelia
    container_name: authelia
    restart: unless-stopped
    environment:
      - TZ=America/Chicago
    volumes:
      - ./authelia:/config
    network_mode: "service:redis" # So we ensure to stay on the same network as the redis container.
    depends_on:
      - redis

  redis:
    image: redis:alpine
    restart: unless-stopped
    container_name: redis_authelia
    command: redis-server --dir /tmp --save "" --appendonly no
    ports:
      - 9091
      - 6379
    environment:
      - TZ=America/Chicago
      - PUID=1000
      - PGID=1000
    volumes:
      - ./redis:/data
    networks:
      infrastructure-network:
        ipv4_address: 172.20.0.5
    dns:
      - 172.20.0.4

# =================================================================================================
# ================================PERSONAL-APPLICATIONS-BELOW======================================
# =================================================================================================

  flask:
    image: alpine
    container_name: flask_healthcheck
    volumes:
      - ./flask/app.py:/app/app.py:ro
    working_dir: /app
    command: sh -c "apk update && apk add --no-cache py3-flask && flask run --host=0.0.0.0 --port=80"
    environment:
      - FLASK_APP=app.py
    networks:
      infrastructure-network:
        ipv4_address: 172.20.1.1
    dns:
      - 172.20.0.4
    depends_on:
      - wireguard

  dashboard:
    container_name: dashboard
    image: glanceapp/glance
    restart: unless-stopped
    volumes:
      - ./dashboard/config:/app/config
      - ./dashboard/assets:/app/assets
    env_file: ./dashboard/.env
    networks:
      infrastructure-network:
        ipv4_address: 172.20.1.2
    dns:
      - 172.20.0.4

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: "https://password.atharvavyas.com"
    volumes:
      - ./vaultwarden/:/data/
    networks:
      infrastructure-network:
        ipv4_address: 172.20.1.3
    dns:
      - 172.20.0.4

  frigate:
    container_name: frigate
    build:
      context: ./frigate
      dockerfile: Dockerfile
    restart: unless-stopped
    command: /bin/bash -c "wg-quick up wg0 && python3 -u -m frigate"
    stop_grace_period: 30s
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ./frigate/config/config.yaml:/config/config.yaml
      - ./frigate/etc/wireguard/wg0.conf:/etc/wireguard/wg0.conf
      - ./frigate/storage:/media/frigate
      - type: tmpfs # Optional: 1GB of memory, reduces SSD/SD Card wear
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "8971:8971"
      - "8554:8554" # RTSP feeds
    networks:
      infrastructure-network:
        ipv4_address: 172.20.1.4
    dns:
      - 172.20.0.4

  frigate_nginx:
    container_name: frigate_nginx
    build:
      context: ./frigate_nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ./frigate_nginx/etc/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frigate_nginx/etc/wireguard:/etc/wireguard:ro
    networks:
      infrastructure-network:
        ipv4_address: 172.20.1.5
    dns:
      - 172.20.0.4

# Ente
  postgres:
    build:
      context: ./ente/postgres
      dockerfile: Dockerfile
    container_name: ente-postgres
    restart: unless-stopped
    network_mode: host  # Change to host mode
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    env_file:
      - ./ente/server/config/.env
    volumes:
      - ./ente/postgres/etc/wireguard/wg0.conf:/etc/wireguard/wg0.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d ente -U ente"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 5
    dns:
      - 172.20.0.4

  museum:
    build:
      context: ./ente/server
    container_name: ente-museum
    restart: unless-stopped
    network_mode: host  # Change to host mode
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./ente/server/config/.env
    environment:
      - MUSEUM_CONFIG_PATH=/museum.yaml
    volumes:
      - ./ente/server/config/museum.yaml:/museum.yaml:ro

  minio:
    image: minio/minio
    container_name: ente-minio
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./ente/server/config/.env
    entrypoint: /bin/sh
    command: 
      - -c
      - |
        minio server /data --address ':3200' --console-address ':3201' &
        sleep 5
        mc alias set local http://localhost:3200 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}
        mc mb local/b2-eu-cen --ignore-existing
        mc mb local/wasabi-eu-central-2-v3 --ignore-existing
        mc mb local/scw-eu-fr-v3 --ignore-existing
        mc anonymous set download local/b2-eu-cen
        mc anonymous set download local/wasabi-eu-central-2-v3
        mc anonymous set download local/scw-eu-fr-v3
        wait
    volumes:
      - ./ente/minio-data:/data

  ente-web:
    build:
      context: ./ente/web
    container_name: ente-web
    restart: unless-stopped
    environment:
      - NODE_ENV=development
    env_file:
      - ./ente/server/config/.env
    network_mode: host  # Change to host mode

networks:
  infrastructure-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
