# Don't read /etc/resolv.conf or /etc/hosts
no-resolv
no-hosts

# Use Google DNS as upstream
server=8.8.8.8
server=8.8.4.4

# Custom domain mappings
address=/example.com/172.20.0.30

# Listen on all interfaces
listen-address=0.0.0.0
bind-interfaces

# Cache settings
cache-size=1000

# Enable query logging
log-queries
